{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth"><div class="auth-card"><div class="logo">☁</div><h1>Create account</h1><p class="muted">Register as a standard user.</p>
<form method="post"><label>Username</label><input name="username" minlength="3" required><label>Password</label><input type="password" name="password" minlength="6" required>
<button class="primary full">Register</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
